<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>QR Message Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      padding: 16px;
      max-width: 900px;
      margin: auto;
      background: #fafafa;
    }

    h1 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #1e1e1e;
      color: #dcdcdc;
      padding: 16px;
      border-radius: 6px;
      overflow-x: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9rem;
    }

    .error {
      color: #b00020;
      background: #ffecec;
      padding: 12px;
      border-radius: 6px;
    }

    .hint {
      color: #555;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <h1>Decoded Message</h1>
  <div class="hint">
    This page expects a pako-deflated Base64URL message in the URL.
  </div>

  <pre id="output">Loading…</pre>

  <!-- pako (inflate) -->
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>

  <script>
    function base64UrlToUint8Array(b64url) {
      const padding = "=".repeat((4 - (b64url.length % 4)) % 4);
      const base64 = (b64url + padding)
        .replace(/-/g, "+")
        .replace(/_/g, "/");

      const raw = atob(base64);
      const bytes = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) {
        bytes[i] = raw.charCodeAt(i);
      }
      return bytes;
    }

    function getPayload() {
      const params = new URLSearchParams(location.search);
      if (params.has("msg")) return params.get("msg");

      if (location.hash.length > 1) {
        return location.hash.slice(1);
      }
      return null;
    }

    const output = document.getElementById("output");

    try {
      const payload = getPayload();
      if (!payload) {
        throw new Error("No payload found in URL.");
      }

      const compressed = base64UrlToUint8Array(payload);
      const inflated = window.pako.inflate(compressed);
      const text = new TextDecoder("utf-8").decode(inflated);

      output.textContent = text;
    } catch (err) {
      output.className = "error";
      output.textContent =
        "Failed to decode message.\n\n" +
        (err?.message || err);
    }
  </script>
</body>
</html>
