<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QR Test</title>
    <style>
      body { font-family: system-ui, sans-serif; padding: 16px; max-width: 700px; margin: 0 auto; }
      textarea { width: 100%; height: 120px; font-size: 16px; }
      #qr { margin-top: 16px; padding: 12px; border: 1px solid #ddd; display: inline-block; }
      .row { display: flex; gap: 12px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
      button { padding: 8px 12px; }
    </style>
  </head>
  <body>
    <h1>QR Code quick test</h1>
    <p>Type any text below. Your phone can scan the QR and display the text.</p>

    <textarea id="text" placeholder="Enter text to encode...">Hello from a QR code!</textarea>

    <div class="row">
      <button id="make">Generate</button>
      <button id="clear">Clear</button>
    </div>

    <div id="qr"></div>

    <!-- Uses a tiny QR library from a CDN -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script>
      const elText = document.getElementById("text");
      const elQR = document.getElementById("qr");
      let qr;

      function generate() {
        const value = elText.value ?? "";
        elQR.innerHTML = "";
        qr = new QRCode(elQR, {
          text: value,
          width: 256,
          height: 256,
          correctLevel: QRCode.CorrectLevel.M
        });
      }

      document.getElementById("make").addEventListener("click", generate);
      document.getElementById("clear").addEventListener("click", () => { elText.value = ""; generate(); });

      // auto-generate on load and when typing (debounced)
      let t;
      elText.addEventListener("input", () => { clearTimeout(t); t = setTimeout(generate, 150); });
      generate();
    </script>
  </body>
</html>
